html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,Segoe UI,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:2vmin;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media (orientation:portrait){#app{flex-direction:column}}
#ring{flex:0 0 auto;width:min(96vw,96vh);height:min(96vw,96vh);touch-action:none}
@media (orientation:landscape){#ring{width:min(96vh,66vw);height:min(96vh,66vw)}}
@media (orientation:portrait){#ring{width:min(98vw,70vh);height:min(98vw,70vh)}}
svg{width:100%;height:100%;display:block;touch-action:none}
.s{fill:#1b2033;stroke:#3a4266;stroke-width:5;stroke-linejoin:round}
.s.A{fill:#1f2947}.s.C{fill:#2a2f4d}
.s.on{fill:var(--on);stroke:#ffd0e6}
.s.A.on{fill:#ffb03a;stroke:#fff1cf}
#btns{display:flex;gap:1.6vmin;touch-action:none}
@media (orientation:landscape){#btns{flex-direction:column;width:22vw;max-width:220px}}
@media (orientation:portrait){#btns{flex-direction:row;width:96vw;flex-wrap:wrap;justify-content:center}}
.b{flex:1 1 0;min-height:11vmin;min-width:16vmin;display:flex;align-items:center;justify-content:center;background:var(--panel);border:2px solid #333b5c;border-radius:14px;font-size:max(3.2vmin,15px);font-weight:600;letter-spacing:.03em;touch-action:none}
.b.on{background:var(--acc);color:#04222b;border-color:#fff}
.b small{display:block;font-weight:400;font-size:.7em;color:var(--dim)}
.b.on small{color:#04222b}
#sel{min-height:16vmin}
#st{position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 4px);font-size:12px;color:var(--dim);pointer-events:none}
#st.ok{color:#5be08a}#st.bad{color:#ff6b6b}
#veil{position:fixed;inset:0;background:rgba(5,6,10,.78);display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;line-height:1.5;z-index:9}
#veil.show{display:flex}

<script>
(function(){
var N=34, ws=null, state=new Array(N).fill(0), btn=[0,0,0,0,0], last='', lastB='';
var polys=document.querySelectorAll('.s'), stEl=document.getElementById('st'), veil=document.getElementById('veil');
var ptrs={}, bptrs={}; // pointerId -> sensor set / button index
var rtt=0, pingT=0;
function send(m){ if(ws&&ws.readyState===1) ws.send(m); }
function pushSensors(){
  var s=''; for(var i=0;i<N;i++) s+=state[i]?'1':'0';
  if(s!==last){ last=s; send('S'+s); }
  for(var i=0;i<N;i++) polys[i].classList.toggle('on',!!state[i]);
}
function pushButtons(){
  var s=''; for(var i=0;i<5;i++) s+=btn[i]?'1':'0';
  if(s!==lastB){ lastB=s; send('B'+s); }
  document.querySelectorAll('.b').forEach(function(e){ e.classList.toggle('on',!!btn[+e.dataset.b]); });
}
function recompute(){
  state.fill(0);
  for(var id in ptrs){ var v=ptrs[id]; if(v>=0) state[v]=1; }
  pushSensors();
}
function hit(x,y){
  var e=document.elementFromPoint(x,y);
  if(e && e.dataset && e.dataset.i!==undefined){
    // C1/C2 overlap each other's rim; fine. Outer sensors win over nothing, so return element index.
    return +e.dataset.i;
  }
  return -1;
}
function onRing(ev){
  ev.preventDefault();
  if(ev.type==='pointerdown'){ ptrs[ev.pointerId]=hit(ev.clientX,ev.clientY); }
  else if(ev.type==='pointermove'){ if(!(ev.pointerId in ptrs)) return; ptrs[ev.pointerId]=hit(ev.clientX,ev.clientY); }
  else { delete ptrs[ev.pointerId]; }
  recompute();
}
var ring=document.getElementById('ring');
['pointerdown','pointermove','pointerup','pointercancel'].forEach(function(t){ ring.addEventListener(t,onRing,{passive:false}); });
// buttons
function onBtn(ev){
  ev.preventDefault();
  var el=ev.target.closest('.b'); 
  if(ev.type==='pointerdown'){ if(!el) return; bptrs[ev.pointerId]=+el.dataset.b; try{el.setPointerCapture(ev.pointerId);}catch(e){} }
  else if(ev.type==='pointerup'||ev.type==='pointercancel'){ delete bptrs[ev.pointerId]; }
  else return;
  btn=[0,0,0,0,0]; for(var id in bptrs) btn[bptrs[id]]=1;
  pushButtons();
}
['pointerdown','pointerup','pointercancel'].forEach(function(t){ document.getElementById('btns').addEventListener(t,onBtn,{passive:false}); });
function releaseAll(){ ptrs={}; bptrs={}; btn=[0,0,0,0,0]; recompute(); pushButtons(); }
document.addEventListener('visibilitychange',function(){ if(document.hidden) releaseAll(); });
window.addEventListener('blur',releaseAll);
['contextmenu','gesturestart','gesturechange','dragstart','selectstart'].forEach(function(t){ document.addEventListener(t,function(e){e.preventDefault();}); });
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
function connect(){
  var proto=location.protocol==='https:'?'wss://':'ws://';
  ws=new WebSocket(proto+location.host+'/ws'+location.search);
  ws.onopen=function(){ veil.classList.remove('show'); stEl.textContent='connected'; stEl.className='ok'; last=''; lastB=''; pushSensors(); pushButtons(); };
  ws.onmessage=function(e){
    var m=e.data;
    if(m[0]==='O'){ rtt=Math.round(performance.now()-pingT); stEl.textContent='connected  '+rtt+' ms'; }
  };
  ws.onclose=function(){ stEl.textContent='disconnected'; stEl.className='bad'; veil.classList.add('show'); setTimeout(connect,700); };
  ws.onerror=function(){ try{ws.close();}catch(e){} };
}
setInterval(function(){ if(ws&&ws.readyState===1){ pingT=performance.now(); send('P'+Date.now()); } },1500);
connect();
})();
</script></body></html>
